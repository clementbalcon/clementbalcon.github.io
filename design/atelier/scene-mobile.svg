<svg class="atelier-scene atelier-scene--mobile" viewBox="0 0 720 1180" role="group" aria-labelledby="at-m-title at-m-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="at-m-title">L'atelier de Clément Balcon</title>
  <desc id="at-m-desc">Un établi avec un outil de brasage, un robot mobile, un poste de CAO, un cric hydraulique, une maquette de tour avec pendule, une tablette et un carnet d'entraînement — chacun ouvre un projet.</desc>
  <rect x="0" y="0" width="720" height="1180" fill="#eeece4"/>

  <!-- établi + solder pen -->
  <a href="matra.html" data-hotspot="matra" aria-label="Solder Pen — outillage de brasage, projet Matra" class="hotspot">
    <g class="obj-etabli">
      <rect x="120" y="270" width="480" height="90" class="furn-front"/>
      <line x1="150" y1="360" x2="150" y2="400" class="ink-line"/>
      <line x1="570" y1="360" x2="570" y2="400" class="ink-line"/>
      <g class="obj-pen">
        <rect x="200" y="200" width="230" height="30" rx="15" class="pen-body" transform="rotate(-9 315 215)"/>
        <rect x="225" y="193" width="46" height="42" rx="8" class="pen-grip" transform="rotate(-9 315 215)"/>
        <circle cx="395" cy="185" r="20" class="pen-gear" transform="rotate(-9 315 215)"/>
        <g class="pen-gear-teeth" transform="rotate(-9 315 215)">
          <line x1="395" y1="161" x2="395" y2="153"/>
          <line x1="395" y1="209" x2="395" y2="217"/>
          <line x1="371" y1="185" x2="363" y2="185"/>
          <line x1="419" y1="185" x2="427" y2="185"/>
        </g>
        <rect x="335" y="177" width="34" height="18" rx="2" class="pen-accent" transform="rotate(-9 315 215)"/>
      </g>
    </g>
    <rect class="hit" x="190" y="90" width="340" height="190"/>
  </a>

  <!-- robot -->
  <a href="robafis.html" data-hotspot="robafis" aria-label="RobAFIS — robot mobile autonome, concours national" class="hotspot">
    <g class="obj-robot">
      <rect x="40" y="555" width="300" height="70" class="furn-front"/>
      <line x1="70" y1="625" x2="70" y2="655" class="ink-line"/>
      <line x1="310" y1="625" x2="310" y2="655" class="ink-line"/>
      <g class="robot-body">
        <rect x="120" y="480" width="130" height="65" rx="6" class="robot-chassis"/>
        <circle cx="140" cy="550" r="24" class="robot-wheel"/>
        <circle cx="235" cy="550" r="24" class="robot-wheel"/>
        <rect x="205" y="415" width="13" height="70" class="robot-mast"/>
        <path d="M218 424 L268 402 L278 362" fill="none" class="robot-arm"/>
        <path d="M278 362 L264 344 M278 362 L292 346" class="robot-arm"/>
        <rect x="150" y="495" width="42" height="28" class="robot-board"/>
        <circle cx="160" cy="504" r="2.3" class="accent-fill"/>
        <circle cx="170" cy="504" r="2.3" class="accent-fill"/>
      </g>
      <g class="award-ring" transform="translate(285,500)">
        <circle r="38" fill="none" class="ink-thin"/>
        <text x="0" y="-3" text-anchor="middle" class="award-text">PRIX</text>
        <text x="0" y="9" text-anchor="middle" class="award-text">INNOVATION</text>
      </g>
    </g>
    <rect class="hit" x="60" y="340" width="260" height="230"/>
  </a>

  <!-- CAO -->
  <a href="nerf.html" data-hotspot="nerf" aria-label="Nerf Rider CS-35 — rétro-conception CATIA V5" class="hotspot">
    <g class="obj-cao">
      <rect x="400" y="490" width="240" height="60" class="furn-front"/>
      <line x1="420" y1="550" x2="420" y2="580" class="ink-line"/>
      <line x1="620" y1="550" x2="620" y2="580" class="ink-line"/>
      <rect x="425" y="368" width="190" height="128" rx="4" class="screen"/>
      <rect x="435" y="378" width="170" height="108" fill="none" class="ink-thin"/>
      <g class="wireframe">
        <path d="M465 470 L465 435 L505 418 L545 435 L545 470 L505 487 Z"/>
        <path d="M465 435 L505 452 L545 435"/>
        <path d="M505 452 L505 487"/>
        <circle cx="565" cy="445" r="13"/>
      </g>
      <rect x="500" y="500" width="26" height="16" class="furn-front"/>
    </g>
    <rect class="hit" x="380" y="340" width="280" height="200"/>
  </a>

  <!-- cric -->
  <a href="tn06.html" data-hotspot="tn06" aria-label="Cric hydraulique — étude de statique TN06" class="hotspot">
    <g class="obj-jack">
      <rect x="70" y="782" width="230" height="16" class="furn-front"/>
      <path d="M110 745 L250 745 L235 782 L120 782 Z" class="jack-body"/>
      <circle cx="130" cy="788" r="7" class="jack-wheel"/>
      <circle cx="230" cy="788" r="7" class="jack-wheel"/>
      <rect x="225" y="716" width="9" height="34" class="jack-handle" transform="rotate(20 230 750)"/>
      <rect x="122" y="683" width="14" height="63" class="jack-ram"/>
      <ellipse cx="129" cy="681" rx="58" ry="13" class="jack-pad"/>
    </g>
    <rect class="hit" x="60" y="620" width="260" height="190"/>
  </a>

  <!-- tour / pendule -->
  <a href="am25.html" data-hotspot="am25" aria-label="Taipei 101 — analyse dynamique, pendule anti-vibratoire" class="hotspot">
    <g class="obj-shelf">
      <rect x="368" y="793" width="220" height="14" class="furn-front"/>
      <line x1="382" y1="807" x2="382" y2="835" class="ink-line"/>
      <line x1="558" y1="807" x2="558" y2="835" class="ink-line"/>
      <g stroke="currentColor" class="tower-ink" fill="none" stroke-width="2">
        <path d="M425 792H495M433 792V775H440L437 758H446L443 741H454L451 724H460L457 707H468V695H476V707H489L486 724H495L492 741H501L498 758H507L504 775H511V792"/>
        <path d="M450 695V682H468V695M458 682V670"/>
        <path d="M453 741H473M453 742L463 765M473 742L463 765" stroke-dasharray="2 3"/>
        <circle cx="463" cy="761" r="8" class="accent-fill" stroke="none"/>
      </g>
    </g>
    <rect class="hit" x="380" y="600" width="220" height="220"/>
  </a>

  <!-- tablette -->
  <a href="cardashboard.html" data-hotspot="cardashboard" aria-label="CarDashboard — CarPlay maison sur iPad" class="hotspot">
    <g class="obj-tablet">
      <rect x="140" y="1032" width="90" height="18" class="furn-front"/>
      <rect x="150" y="945" width="68" height="94" rx="6" class="screen" transform="rotate(-4 184 992)"/>
      <rect x="158" y="954" width="52" height="76" rx="2" fill="none" class="ink-thin" transform="rotate(-4 184 992)"/>
      <line x1="164" y1="969" x2="200" y2="969" class="ink-thin" transform="rotate(-4 184 992)"/>
      <line x1="164" y1="983" x2="190" y2="983" class="ink-thin" transform="rotate(-4 184 992)"/>
    </g>
    <rect class="hit" x="90" y="870" width="220" height="190"/>
  </a>

  <!-- carnet + sac -->
  <a href="training.html" data-hotspot="training" aria-label="Training Tracker — suivi d'entraînements" class="hotspot">
    <g class="obj-training">
      <path d="M400 1040 Q390 985 440 980 Q500 975 508 1015 Q513 1048 478 1052 Z" class="bag-shape"/>
      <line x1="420" y1="992" x2="460" y2="1055" class="ink-thin"/>
      <rect x="490" y="950" width="86" height="66" rx="3" class="notebook" transform="rotate(6 533 983)"/>
      <g class="spiral" transform="rotate(6 533 983)">
        <line x1="492" y1="954" x2="492" y2="1012"/>
        <line x1="492" y1="961" x2="487" y2="961"/>
        <line x1="492" y1="974" x2="487" y2="974"/>
        <line x1="492" y1="987" x2="487" y2="987"/>
        <line x1="492" y1="1000" x2="487" y2="1000"/>
      </g>
    </g>
    <rect class="hit" x="380" y="880" width="260" height="180"/>
  </a>
</svg>
