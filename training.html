<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Training">
    <title>Training — Clément Balcon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #060c15;
            --accent: #38bdf8;
            --accent2: #fb923c;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --subtle: #1e293b;
            --card: #0f1c2e;
            --border: rgba(56,189,248,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56,189,248,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,189,248,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── LOGIN ─── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .login-sub {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        /* ─── FORM ELEMENTS ─── */
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, textarea {
            width: 100%;
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        select option { background: var(--card); }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: #060c15;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
        .btn-orange { background: var(--accent2); }

        /* ─── APP ─── */
        #app-screen {
            display: none;
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .app-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
        }

        .logout-btn:hover { color: var(--text); }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.3rem;
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.6rem;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--subtle);
            color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── CARDS ─── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1.25rem;
        }

        /* ─── SPORT PICKER ─── */
        .sport-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .sport-btn {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 0.75rem 0.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .sport-emoji { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }

        .sport-btn:hover, .sport-btn.selected {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56,189,248,0.08);
        }

        /* ─── EXERCICE FORM ─── */
        .exercice-form {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .exercice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .exercice-num {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem 0.4rem;
        }

        .remove-btn:hover { color: #f87171; }

        .exercice-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .exercice-row input { margin-bottom: 0; }

        /* ─── SET LOGGER ─── */
        .set-section { margin-bottom: 0.75rem; }

        .reps-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.4rem;
        }

        .rep-chip {
            width: 42px;
            height: 42px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .rep-chip.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: #060c15;
            font-weight: 700;
        }

        .poids-stepper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.4rem;
        }

        .poids-stepper-btns {
            display: flex;
            gap: 0.3rem;
        }

        .stepper-btn {
            flex: 1;
            height: 40px;
            min-width: 0;
            padding: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .poids-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .poids-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .poids-unit { color: var(--muted); font-size: 0.72rem; margin-top: 0.1rem; }

        .btn-log-set {
            width: 100%;
            background: rgba(56,189,248,0.1);
            border: 1px solid rgba(56,189,248,0.3);
            border-radius: 8px;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.65rem;
            margin-top: 0.25rem;
            transition: background 0.2s;
        }

        .btn-log-set:hover { background: rgba(56,189,248,0.18); }

        .sets-logged { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .rest-timer-display {
            display: none;
            text-align: center;
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 0.03em;
        }
        .rest-timer-display.active { display: block; }
        .rest-timer-display .rest-time {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .rest-timer-display.long .rest-time { color: var(--accent2); }

        .set-row {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0.5rem 0.75rem;
            gap: 0.5rem;
        }

        .set-num { font-size: 0.75rem; color: var(--muted); min-width: 52px; }
        .set-detail { font-size: 0.9rem; color: var(--text); flex: 1; font-weight: 500; }
        .set-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 0.1rem 0.3rem; }
        .set-remove:hover { color: #f87171; }

        /* ─── DERNIÈRE SÉANCE ─── */
        .last-session {
            display: none;
            background: rgba(56,189,248,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.82rem;
        }
        .last-date { color: var(--muted); font-size: 0.75rem; }
        .last-sets { color: var(--text); font-weight: 500; margin-top: 0.2rem; }
        .btn-reprendre {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--accent);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            margin-top: 0.4rem;
            transition: background 0.15s;
        }
        .btn-reprendre:hover { background: rgba(56,189,248,0.08); }

        /* ─── HISTORIQUE ─── */
        .seance-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .seance-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .seance-sport {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .seance-date { font-size: 0.8rem; color: var(--muted); }

        .seance-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .meta-chip {
            background: var(--subtle);
            border-radius: 6px;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            color: var(--muted);
        }

        .exercice-list {
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .exercice-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exercice-name { font-size: 0.85rem; color: var(--text); }
        .exercice-detail { font-size: 0.8rem; color: var(--muted); }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.4;
            padding: 0.1rem 0.3rem;
            transition: opacity 0.2s;
        }

        .delete-btn:hover { opacity: 1; }

        /* ─── EXERCISE PICKER ─── */
        .ex-preview {
            display: none;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            overflow: hidden;
            background: #e8edf2;
            text-align: center;
        }

        .ex-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .ex-preview-placeholder {
            padding: 1.5rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* ─── ANALYSE ─── */
        .analyse-output {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            line-height: 1.75;
            white-space: pre-wrap;
            display: none;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── MESSAGES ─── */
        .msg {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
        .msg.success { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); color: var(--accent); }
        .msg.info { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); color: var(--accent2); }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

        /* ─── CHRONO ─── */
        .chrono-wrap {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        #chrono-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .chrono-btns {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .chrono-btn {
            background: var(--accent);
            border: none;
            border-radius: 7px;
            color: #060c15;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            transition: opacity 0.2s;
        }

        .chrono-btn:hover { opacity: 0.85; }
        .chrono-reset { background: transparent; color: var(--muted); border: 1px solid var(--border); }

        /* ─── SPLITS ─── */
        .splits-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }
        .split-chip {
            background: rgba(56,189,248,0.06);
            border: 1px solid rgba(56,189,248,0.15);
            border-radius: 6px;
            padding: 0.2rem 0.5rem;
            font-size: 0.78rem;
            color: var(--text);
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }
        .split-km {
            color: var(--muted);
            font-size: 0.72rem;
        }

        /* ─── STATS ─── */
        .sport-filter {
            display: flex;
            gap: 0.5rem;
        }
        .filter-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 0.5rem 0.25rem;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: rgba(56,189,248,0.1);
            border-color: var(--accent);
            color: var(--accent);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }
        .stat-card.wide { grid-column: span 2; }
        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }
        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-value.orange { color: var(--accent2); }
        .stat-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.15rem;
        }

        /* ─── BOUTON TRACÉ ─── */
        .btn-map {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        .btn-map:hover { background: rgba(56,189,248,0.08); }

        /* ─── MODAL CARTE ─── */
        #map-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(6,12,21,0.97);
            padding: 1rem;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #map-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        #map-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--accent);
        }
        #map-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
        }
        #map { height: calc(100dvh - 5rem); border-radius: 12px; }
    </style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
    <div class="login-card">
        <div class="login-title">Training</div>
        <div class="login-sub">Espace privé — Clément Balcon</div>
        <div id="login-msg" class="msg error"></div>
        <label>Email</label>
        <input type="email" id="email" placeholder="ton@email.com" autocomplete="email">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <button class="btn" onclick="login()">Connexion</button>
    </div>
</div>

<!-- ─── APP ─── -->
<div id="app-screen">
    <div class="app-header">
        <div class="app-title">Training</div>
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('nouvelle')">Séance</button>
        <button class="tab" onclick="switchTab('historique')">Historique</button>
        <button class="tab" onclick="switchTab('stats')">Stats</button>
        <button class="tab" onclick="switchTab('analyse')">IA</button>
    </div>

    <!-- TAB: NOUVELLE SÉANCE -->
    <div id="tab-nouvelle" class="tab-content active">
        <div class="card">
            <div class="card-title">Nouvelle séance</div>
            <div id="seance-msg" class="msg"></div>

            <label>Sport</label>
            <div class="sport-grid">
                <button class="sport-btn" onclick="selectSport('Course à pied', this)">
                    <span class="sport-emoji">🏃</span>Course
                </button>
                <button class="sport-btn" onclick="selectSport('Musculation', this)">
                    <span class="sport-emoji">🏋️</span>Muscu
                </button>
                <button class="sport-btn" onclick="selectSport('Street Workout', this)">
                    <span class="sport-emoji">💪</span>Street
                </button>
            </div>

            <label>Date</label>
            <input type="date" id="seance-date">

            <label>Durée</label>
            <div class="chrono-wrap">

function chronoToggle() {
    const btn = document.getElementById('chrono-toggle');
    if (chronoRunning) {
        clearInterval(chronoInterval);
        chronoRunning = false;
        btn.textContent = 'Reprendre';
    } else {
        chronoInterval = setInterval(() => {
            chronoSeconds++;
            const h = String(Math.floor(chronoSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((chronoSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(chronoSeconds % 60).padStart(2, '0');
            document.getElementById('chrono-display').textContent = `${h}:${m}:${s}`;
        }, 1000);
        chronoRunning = true;
        btn.textContent = 'Pause';
    }
}

function chronoReset() {
    clearInterval(chronoInterval);
    chronoRunning = false;
    chronoSeconds = 0;
    document.getElementById('chrono-display').textContent = '00:00:00';
    document.getElementById('chrono-toggle').textContent = 'Démarrer';
}

// ─── AUTH ───
async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('login-msg');

    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
        showMsg(msg, 'error', 'Email ou mot de passe incorrect.');
    } else {
        showApp();
    }
}

    await db.auth.signOut();
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
    const { data: { session } } = await db.auth.getSession();
    if (session) showApp();
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

}

    const poidsHTML = sport === 'Musculation' ? `

                    <button type="button" class="stepper-btn" onclick="adjustPoids(this.closest('.exercice-form'), 2.5)">+2.5</button>

    return `

function selectRep(form, n) {
    form.querySelectorAll('.rep-chip').forEach(c => c.classList.remove('selected'));
    form.querySelectorAll('.rep-chip')[n - 1].classList.add('selected');
    form.dataset.selectedReps = n;
}

function adjustPoids(form, delta) {
    const el = form.querySelector('.poids-val');
    const next = Math.max(0, Math.round((parseFloat(el.textContent) + delta) * 10) / 10);
    el.textContent = next % 1 === 0 ? next : next.toFixed(1);
}

let _restInterval = null;

function _tickRestTimers() {
    document.querySelectorAll('.rest-timer-display.active').forEach(el => {
        const t = parseInt(el.dataset.start);
        if (!t) return;
        const elapsed = Math.floor((Date.now() - t) / 1000);
        const m = Math.floor(elapsed / 60), s = elapsed % 60;
        el.querySelector('.rest-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
        el.classList.toggle('long', elapsed >= 120);
    });
    const overlay = document.getElementById('rest-overlay');
    if (overlay?.style.display === 'flex') {
        const t = parseInt(overlay.dataset.start);
        if (t) {
            const elapsed = Math.floor((Date.now() - t) / 1000);
            const m = Math.floor(elapsed / 60), s = elapsed % 60;
            const timeEl = document.getElementById('rest-overlay-time');
            timeEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
            timeEl.style.color = elapsed >= 120 ? '#fb923c' : '#38bdf8';
        }
    }
}

function dismissRestOverlay() {
    clearInterval(_restInterval);
    _restInterval = null;
    document.getElementById('rest-overlay').style.display = 'none';
    document.querySelectorAll('.rest-timer-display.active').forEach(el => {
        el.classList.remove('active', 'long');
    });
}

function logSet(form) {
    const reps = parseInt(form.dataset.selectedReps);
    if (!reps) {
        const chips = form.querySelector('.reps-chips');
        chips.style.outline = '1.5px solid #f87171';
        setTimeout(() => chips.style.outline = '', 800);
        return;
    }
    const poidsEl = form.querySelector('.poids-val');
    const poids = poidsEl ? parseFloat(poidsEl.textContent) : null;
    const container = form.querySelector('.sets-logged');
    const setNum = container.children.length + 1;

    const row = document.createElement('div');
    row.className = 'set-row';
    row.dataset.reps = reps;
    row.dataset.poids = poids !== null ? poids : '';
    row.innerHTML = `
        <span class="set-num">Série ${setNum}</span>
        <span class="set-detail">${reps} reps${poids ? ` × ${poids} kg` : ''}</span>
        <button class="set-remove" onclick="this.closest('.set-row').remove(); renumberSets(this.closest('.sets-logged'))">×</button>`;
    container.appendChild(row);

    form.querySelectorAll('.rep-chip').forEach(c => c.classList.remove('selected'));
    delete form.dataset.selectedReps;

    const now = Date.now();
    const timerEl = form.querySelector('.rest-timer-display');
    if (timerEl) {
        timerEl.dataset.start = now;
        timerEl.querySelector('.rest-time').textContent = '0:00';
        timerEl.classList.remove('long');
        timerEl.classList.add('active');
    }
    const overlay = document.getElementById('rest-overlay');
    if (overlay) {
        overlay.dataset.start = now;
        document.getElementById('rest-overlay-time').textContent = '0:00';
        document.getElementById('rest-overlay-time').style.color = '#38bdf8';
        overlay.style.display = 'flex';
    }
    if (!_restInterval) _restInterval = setInterval(_tickRestTimers, 1000);
}

function renumberSets(container) {
    container.querySelectorAll('.set-row').forEach((row, i) => {
        row.querySelector('.set-num').textContent = `Série ${i + 1}`;
    });
}

function updateExerciceList(categorySelect) {

        `<option value="${e.nom}" data-img="${e.gif || ''}">${e.nom}</option>`
    ).join('');

function updateExercicePreview(exSelect) {
    const form = exSelect.closest('.exercice-form');
    const preview = form.querySelector('.ex-preview');
    const imgUrl = exSelect.options[exSelect.selectedIndex]?.dataset.img;
    if (imgUrl) {
        preview.innerHTML = `<img src="${imgUrl}" onerror="this.closest('.ex-preview').style.display='none'">`;
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
    fetchLastSession(exSelect.value, form);

async function fetchLastSession(nom, form) {
    const lastEl = form.querySelector('.last-session');
    if (!lastEl) return;
    lastEl.style.display = 'none';

    const { data } = await db
        .from('exercices')
        .select('series, reps, poids_kg, seance_id, seances(date)')
        .eq('nom', nom);

    if (!data?.length) return;

    data.sort((a, b) => (b.seances?.date || '').localeCompare(a.seances?.date || ''));
    const latestSeanceId = data[0].seance_id;
    const latestDate = data[0].seances?.date;
    const latestSets = data
        .filter(e => e.seance_id === latestSeanceId && e.reps)
        .sort((a, b) => (a.series || 0) - (b.series || 0));

    if (!latestSets.length) return;

    const dateStr = new Date(latestDate + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    const setsStr = latestSets.map(e => e.poids_kg ? `${e.reps}×${e.poids_kg}kg` : `${e.reps} reps`).join(' · ');

    lastEl.dataset.sets = JSON.stringify(latestSets);
    lastEl.innerHTML = `
        <div class="last-date">Dernière fois · ${dateStr}</div>
        <div class="last-sets">${setsStr}</div>
        <button type="button" class="btn-reprendre" onclick="reprendreSets(this.closest('.exercice-form'))">↩ Reprendre ces séries</button>`;
    lastEl.style.display = 'block';
}

function reprendreSets(form) {
    const lastEl = form.querySelector('.last-session');
    const sets = JSON.parse(lastEl.dataset.sets || '[]');
    const container = form.querySelector('.sets-logged');
    container.innerHTML = '';

    sets.forEach((s, i) => {
        const poidsEl = form.querySelector('.poids-val');
        if (poidsEl && s.poids_kg) poidsEl.textContent = s.poids_kg;

        const row = document.createElement('div');
        row.className = 'set-row';
        row.dataset.reps = s.reps;
        row.dataset.poids = s.poids_kg || '';
        row.innerHTML = `
            <span class="set-num">Série ${i + 1}</span>
            <span class="set-detail">${s.reps} reps${s.poids_kg ? ` × ${s.poids_kg} kg` : ''}</span>
            <button class="set-remove" onclick="this.closest('.set-row').remove(); renumberSets(this.closest('.sets-logged'))">×</button>`;
        container.appendChild(row);
    });
}

async function saveSeance() {
    const msg = document.getElementById('seance-msg');

    if (!selectedSport) {
        showMsg(msg, 'error', 'Sélectionne un sport.');
        return;
    }

    const date = document.getElementById('seance-date').value;
    const duree = chronoSeconds > 0 ? Math.round(chronoSeconds / 60) : null;
    const notes = document.getElementById('seance-notes').value;

    const { data: { user } } = await db.auth.getUser();

    const { data: seance, error } = await db.from('seances').insert({
        sport: selectedSport, date, duree_min: duree, notes, user_id: user.id
    }).select().single();

    if (error) { showMsg(msg, 'error', 'Erreur lors de l\'enregistrement.'); return; }

    const exercices = [];
    document.querySelectorAll('.exercice-form').forEach(form => {
        const nom = form.querySelector('.ex-nom-select')?.value?.trim();
        if (!nom) return;
        const notes = form.querySelector('.ex-notes')?.value || null;
        const setRows = form.querySelectorAll('.set-row');

        if (setRows.length > 0) {
            setRows.forEach((row, i) => {
                exercices.push({
                    seance_id: seance.id,
                    nom,
                    series:   i + 1,
                    reps:     parseInt(row.dataset.reps) || null,
                    poids_kg: row.dataset.poids ? parseFloat(row.dataset.poids) : null,
                    notes:    i === 0 ? notes : null,
                });
            });
        } else {
            exercices.push({
                seance_id:   seance.id,
                nom,
                distance_km: parseFloat(form.querySelector('.ex-distance')?.value) || null,
                temps_min:   parseFloat(form.querySelector('.ex-temps')?.value)    || null,
                notes,
            });
        }
    });

    if (exercices.length > 0) await db.from('exercices').insert(exercices);

    showMsg(msg, 'success', 'Séance enregistrée !');
    setTimeout(() => {
        document.getElementById('seance-notes').value = '';
        chronoReset();
        document.getElementById('exercices-container').innerHTML = '';
        document.getElementById('seance-date').value = new Date().toISOString().split('T')[0];
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('selected'));
        selectedSport = null;
        exerciceCount = 0;
        msg.style.display = 'none';
    }, 2000);
}

async function handleAppleHealthImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const importMsg = document.getElementById('import-msg');
    showMsg(importMsg, 'info', 'Lecture du fichier en cours...');

    const text = await file.text();
    let raw;
    try { raw = JSON.parse(text); } catch(e) {
        showMsg(importMsg, 'error', 'Fichier invalide. Utilise running_workouts.json généré par le script Python.');
        return;
    }

    const workouts = raw.map(r => ({
        startDate:  r.startDate,
        date:       r.startDate.substring(0, 10),
        duration:   r.duration,
        distanceKm: r.distanceKm,
        calories:   r.calories,
        hrAvg:      r.hrAvg,
        hrMax:      r.hrMax,
        pace:       r.paceMinKm,
        splits:     r.splits || [],
        track:      r.track || []
    })).filter(w => w.startDate);

    if (!workouts.length) {
        showMsg(importMsg, 'error', 'Aucune course trouvée dans ce fichier.');
        return;
    }

    showMsg(importMsg, 'info', `${workouts.length} courses trouvées, import en cours...`);

    const userId = (await db.auth.getUser()).data.user.id;

    const { data: existing } = await db.from('seances')
        .select('external_id')
        .eq('user_id', userId)
        .not('external_id', 'is', null);
    const existingIds = new Set(existing?.map(r => r.external_id) || []);

    const toInsert = workouts
        .filter(w => !existingIds.has(w.startDate))
        .map(w => ({
            user_id:     userId,
            sport:       'Course à pied',
            date:        w.date,
            duree_min:   Math.round(w.duration),
            distance_km: w.distanceKm,
            calories:    w.calories,
            hr_avg:      w.hrAvg,
            hr_max:      w.hrMax,
            pace:        w.pace,
            splits:      w.splits.length ? w.splits : null,
            track:       w.track.length  ? w.track  : null,
            source:      'apple_health',
            external_id: w.startDate
        }));

    if (!toInsert.length) {
        showMsg(importMsg, 'success', 'Toutes les courses sont déjà importées.');
        return;
    }

    let inserted = 0;
    for (let i = 0; i < toInsert.length; i += 50) {
        const { error } = await db.from('seances').insert(toInsert.slice(i, i + 50));
        if (!error) inserted += Math.min(50, toInsert.length - i);
    }

    const skipped = workouts.length - toInsert.length;
    showMsg(importMsg, 'success', `✓ ${inserted} courses importées${skipped ? `, ${skipped} déjà présentes` : ''}.`);
    loadHistorique();
}

function renderAnalyse() {

    renderMetrics(currentSport, seances);
    renderPeriodSelector(seances);

function renderPeriodSelector(seances) {

    });

}

function setPeriod(year, btn) {

    chartLevel = 'months'; drillMonth = null; drillWeek = null;
    document.querySelectorAll('#period-selector .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

}

function renderMetrics(sport, seances) {
    const el = document.getElementById('stats-metrics');
    const filtered = selectedYear === 'Tout' ? seances : seances.filter(s => s.date?.startsWith(selectedYear));
    if (!filtered.length) {
        el.innerHTML = `<div class="stat-card wide"><div class="stat-label">Aucune séance enregistrée</div></div>`;
        return;
    }

    const fmtPace = sec => `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}`;

    if (sport === 'Course à pied') {
        const totalKm   = filtered.reduce((a, s) => a + (s.distance_km || 0), 0);
        const totalMin  = filtered.reduce((a, s) => a + (s.duree_min || 0), 0);
        const longuest  = Math.max(...filtered.map(s => s.distance_km || 0));
        const paces     = filtered.filter(s => s.pace).map(s => { const [m,sec]=s.pace.split(':').map(Number); return m*60+sec; });
        const bestPace  = paces.length ? Math.min(...paces) : null;
        const avgPace   = paces.length ? paces.reduce((a,b)=>a+b,0)/paces.length : null;
        el.innerHTML = `
            <div class="stat-card"><div class="stat-label">Total distance</div><div class="stat-value">${totalKm.toFixed(1)} <span style="font-size:1rem">km</span></div><div class="stat-sub">${filtered.length} sorties</div></div>
            <div class="stat-card"><div class="stat-label">Temps total</div><div class="stat-value">${Math.floor(totalMin/60)}h<span style="font-size:1rem">${Math.round(totalMin%60)}m</span></div></div>
            <div class="stat-card"><div class="stat-label">Meilleure allure</div><div class="stat-value orange">${bestPace ? fmtPace(bestPace) : '—'} <span style="font-size:1rem">/km</span></div></div>
            <div class="stat-card"><div class="stat-label">Allure moyenne</div><div class="stat-value">${avgPace ? fmtPace(avgPace) : '—'} <span style="font-size:1rem">/km</span></div></div>
            <div class="stat-card"><div class="stat-label">Plus longue sortie</div><div class="stat-value orange">${longuest.toFixed(1)} <span style="font-size:1rem">km</span></div></div>
            <div class="stat-card"><div class="stat-label">Distance moyenne</div><div class="stat-value">${(totalKm/filtered.length).toFixed(1)} <span style="font-size:1rem">km</span></div></div>`;
    } else {
        const totalMin = filtered.reduce((a, s) => a + (s.duree_min || 0), 0);
        const avgMin   = Math.round(totalMin / filtered.length);
        el.innerHTML = `
            <div class="stat-card"><div class="stat-label">Séances total</div><div class="stat-value">${filtered.length}</div></div>
            <div class="stat-card"><div class="stat-label">Temps total</div><div class="stat-value">${Math.floor(totalMin/60)}h<span style="font-size:1rem">${Math.round(totalMin%60)}m</span></div></div>
            <div class="stat-card wide"><div class="stat-label">Durée moyenne / séance</div><div class="stat-value">${avgMin} <span style="font-size:1rem">min</span></div></div>`;
    }
}

function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return { week: Math.ceil((((d - yearStart) / 86400000) + 1) / 7), year: d.getUTCFullYear() };
}

function renderChart(sport, allFiltered) {
    const seances = selectedYear === 'Tout' ? allFiltered : allFiltered.filter(s => s.date?.startsWith(selectedYear));
    const isRun = sport === 'Course à pied';
    const val = s => isRun ? (s.distance_km || 0) : 1;
    const fmtVal = v => isRun ? v.toFixed(1) : String(v);
    const unit = isRun ? 'km' : 'séance';

    let labels = [], values = [], title = '', breadcrumb = '';

    if (chartLevel === 'months') {
        if (selectedYear === 'Tout') {
            const firstDate = seances[0]?.date;
            const now = new Date();
            const keys = [];
            if (firstDate) {
                let y = parseInt(firstDate.slice(0,4)), m = 1;
                while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth()+1)) {
                    keys.push(`${y}-${String(m).padStart(2,'0')}`);
                    if (++m > 12) { m = 1; y++; }
                }
            }
            const monthMap = Object.fromEntries(keys.map(k => [k, 0]));
            seances.forEach(s => { const k = s.date?.slice(0,7); if (k && k in monthMap) monthMap[k] += val(s); });
            chartMonthKeys = keys;
            labels = keys.map(k => { const [yr, mn] = k.split('-').map(Number); return new Date(yr, mn-1, 1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}); });
            values = keys.map(k => monthMap[k]);
            title = isRun ? 'Kilomètres par mois' : 'Séances par mois';
        } else {
            const keys = Array.from({length:12}, (_, i) => String(i+1).padStart(2,'0'));
            const monthMap = Object.fromEntries(keys.map(k => [k, 0]));
            seances.forEach(s => { const m = s.date?.slice(5,7); if (m && m in monthMap) monthMap[m] += val(s); });
            chartMonthKeys = keys.map(k => `${selectedYear}-${k}`);
            labels = keys.map(k => new Date(parseInt(selectedYear), parseInt(k)-1, 1).toLocaleDateString('fr-FR',{month:'short'}));
            values = keys.map(k => monthMap[k]);
            title = isRun ? `Km en ${selectedYear}` : `Séances en ${selectedYear}`;
        }
        breadcrumb = '';
    } else if (chartLevel === 'weeks') {
        const [yr, mn] = drillMonth.split('-').map(Number);
        const daysInMonth = new Date(yr, mn, 0).getDate();
        const weekMap = {};
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(yr, mn-1, d);
            const { week, year: wy } = getWeekNumber(date);
            const key = `${wy}-W${String(week).padStart(2,'0')}`;
            if (!weekMap[key]) weekMap[key] = 0;
        }
        seances.filter(s => s.date?.startsWith(drillMonth)).forEach(s => {
            const { week, year: wy } = getWeekNumber(new Date(s.date));
            const key = `${wy}-W${String(week).padStart(2,'0')}`;
            weekMap[key] = (weekMap[key]||0) + val(s);
        });
        const keys = Object.keys(weekMap).sort();
        labels = keys.map(k => `Sem. ${k.split('-W')[1]}`);
        values = keys.map(k => weekMap[k]);
        const [dmY, dmM] = drillMonth.split('-').map(Number);
        title = isRun ? `Km — ${new Date(dmY, dmM-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}` : `Séances — ${new Date(dmY, dmM-1, 1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}`;
        breadcrumb = `← <a href="#" onclick="drillUp(event)" style="color:#38bdf8;text-decoration:none">Retour aux mois</a>`;
    } else if (chartLevel === 'days') {
        const { year: wy, week: wn } = drillWeek;
        const jan4 = new Date(Date.UTC(wy, 0, 4));
        const weekStart = new Date(jan4);
        weekStart.setUTCDate(jan4.getUTCDate() - (jan4.getUTCDay() || 7) + 1 + (wn - 1) * 7);
        const dayMap = {};
        for (let d = 0; d < 7; d++) {
            const day = new Date(weekStart); day.setUTCDate(weekStart.getUTCDate() + d);
            const key = day.toISOString().slice(0,10);
            dayMap[key] = 0;
        }
        seances.forEach(s => { if (dayMap.hasOwnProperty(s.date)) dayMap[s.date] += val(s); });
        const keys = Object.keys(dayMap).sort();
        labels = keys.map(k => { const [yr,mn,dd] = k.split('-').map(Number); return new Date(yr, mn-1, dd).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'}); });
        values = keys.map(k => dayMap[k]);
        title = isRun ? `Km — Semaine ${wn}` : `Séances — Semaine ${wn}`;
        breadcrumb = `← <a href="#" onclick="drillUp(event)" style="color:#38bdf8;text-decoration:none">Retour aux semaines</a>`;
    }

    document.getElementById('chart-title').textContent = title;
    document.getElementById('chart-breadcrumb').innerHTML = breadcrumb;

    if (statsChart) statsChart.destroy();
    statsChart = new Chart(document.getElementById('stats-chart'), {
        type: 'bar',
        data: {
            labels,
            datasets: [{ data: values, backgroundColor: 'rgba(56,189,248,0.25)', borderColor: '#38bdf8', borderWidth: 1.5, borderRadius: 4 }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${fmtVal(ctx.parsed.y)} ${unit}` } } },
            scales: {
                x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: 'rgba(56,189,248,0.05)' } },
                y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: 'rgba(56,189,248,0.05)' }, beginAtZero: true }
            },
            onClick(event, elements) {
                if (!elements.length) return;
                const idx = elements[0].index;
                if (chartLevel === 'months') {
                    const monthKey = chartMonthKeys[idx];
                    if (!monthKey) return;
                    drillMonth = monthKey;
                    chartLevel = 'weeks';
                    renderChart(sport, allFiltered);
                } else if (chartLevel === 'weeks') {
                    const [yr, mn] = drillMonth.split('-').map(Number);
                    const jan4 = new Date(yr, 0, 4);
                    const weekMap = {};
                    const daysInMonth = new Date(yr, mn, 0).getDate();
                    for (let d = 1; d <= daysInMonth; d++) {
                        const date = new Date(yr, mn-1, d);
                        const { week, year: wy } = getWeekNumber(date);
                        const key = `${wy}-W${String(week).padStart(2,'0')}`;
                        if (!weekMap[key]) weekMap[key] = true;
                    }
                    const weekKeys = Object.keys(weekMap).sort();
                    const chosen = weekKeys[idx];
                    if (chosen) {
                        const [wy, wStr] = chosen.split('-W');
                        drillWeek = { year: parseInt(wy), week: parseInt(wStr) };
                        chartLevel = 'days';
                        renderChart(sport, allFiltered);
                    }
                }
            }
        }
    });
}

function drillUp(e) {
    e.preventDefault();
    if (chartLevel === 'days') { chartLevel = 'weeks'; drillWeek = null; }
    else if (chartLevel === 'weeks') { chartLevel = 'months'; drillMonth = null; }
    const seances = allSeances.filter(s => s.sport === currentSport);
    renderChart(currentSport, seances);
}

// ── RECORDS ──────────────────────────────────────────────────────────────────

function parseTimeToSec(t) {
    const p = String(t).split(':').map(Number);
    if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
    if (p.length === 2) return p[0]*60 + p[1];
    return Infinity;
}

function fmtTimeSec(sec) {
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.round(sec%60);
    return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function renderRecords() {
    const el = document.getElementById('stats-records');

        <span style="font-size:0.8rem;color:var(--muted)">Records personnels</span>
        <button class="btn btn-secondary" style="padding:0.35rem 0.75rem;font-size:0.8rem" onclick="openRecordModal()">+ Ajouter</button>
    </div>`;

    if (currentSport === 'Course à pied') {
        const ranges = [
            { label: 'RP 5 km', min: 4.5, max: 5.5 },
            { label: 'RP 10 km', min: 9.0, max: 11.0 },
            { label: 'RP Semi', min: 20.0, max: 22.5 },
        ];
        const cards = ranges.map(r => {
            const matches = allSeances.filter(s => s.sport === 'Course à pied' && s.distance_km >= r.min && s.distance_km <= r.max && s.pace);
            if (!matches.length) return `<div class="stat-card"><div class="stat-label">${r.label}</div><div class="stat-value" style="color:#94a3b8">—</div></div>`;
            const best = matches.reduce((b, s) => parseTimeToSec(s.pace) < parseTimeToSec(b.pace) ? s : b);
            const [pm, ps] = best.pace.split(':').map(Number);
            const bestSec = best.distance_km * (pm*60 + ps);
            const badge = best.source === 'record_manuel' ? ' ✏️' : '';
            const sub = best.source === 'record_manuel' ? `${best.date}${badge}` : `${best.pace}/km — ${best.date}`;
            return `<div class="stat-card"><div class="stat-label">${r.label}</div><div class="stat-value orange">${fmtTimeSec(bestSec)}</div><div class="stat-sub">${sub}</div></div>`;
        });
        el.innerHTML = header + `<div class="stats-grid">${cards.join('')}</div>`;

    } else if (currentSport === 'Musculation') {
        const candidates = allExercices.filter(e => e.nom && e.nom.toLowerCase().includes('développé couché') && e.poids_kg);
        let inner;
        if (!candidates.length) {
            inner = `<div class="stat-value" style="color:#94a3b8">—</div>`;
        } else {
            const best = candidates.reduce((b, e) => e.poids_kg > b.poids_kg ? e : b);
            const seance = allSeances.find(s => s.id === best.seance_id);
            const badge = seance?.source === 'record_manuel' ? ' ✏️' : '';
            inner = `<div class="stat-value orange">${best.poids_kg} <span style="font-size:1rem">kg</span></div><div class="stat-sub">${best.reps} rep${best.reps > 1 ? 's' : ''} — ${seance?.date || ''}${badge}</div>`;
        }
        el.innerHTML = header + `<div class="stats-grid"><div class="stat-card wide"><div class="stat-label">Max Développé couché</div>${inner}</div></div>`;

    } else if (currentSport === 'Street Workout') {
        const candidates = allExercices.filter(e => e.nom && e.nom.toLowerCase().includes('muscle up') && e.reps);
        let inner;
        if (!candidates.length) {
            inner = `<div class="stat-value" style="color:#94a3b8">—</div>`;
        } else {
            const best = candidates.reduce((b, e) => e.reps > b.reps ? e : b);
            const seance = allSeances.find(s => s.id === best.seance_id);
            const badge = seance?.source === 'record_manuel' ? ' ✏️' : '';
            inner = `<div class="stat-value orange">${best.reps}</div><div class="stat-sub">${seance?.date || ''}${badge}</div>`;
        }
        el.innerHTML = header + `<div class="stats-grid"><div class="stat-card wide"><div class="stat-label">Max Muscle Ups d'affilée</div>${inner}</div></div>`;
    }
}

async function saveManualRecord() {
    const date = document.getElementById('rec-date')?.value || new Date().toISOString().slice(0,10);
    const { data: { user } } = await db.auth.getUser();
    const uid = user.id;

    if (currentSport === 'Course à pied') {
        const active = document.querySelector('#rtype-5k.active, #rtype-10k.active, #rtype-semi.active');
        const type = active?.textContent?.trim() || '5 km';
        const time = document.getElementById('rec-time')?.value?.trim();
        if (!time) return;
        const distMap = { '5 km': 5.0, '10 km': 10.0, 'Semi': 21.097 };
        const distKm = distMap[type] || 5.0;
        const totalSec = parseTimeToSec(time);
        const paceSec = totalSec / distKm;
        const pace = `${Math.floor(paceSec/60)}:${String(Math.round(paceSec%60)).padStart(2,'0')}`;
        await db.from('seances').insert({ user_id: uid, sport: 'Course à pied', date, distance_km: distKm, pace, duree_min: Math.round(totalSec/60), source: 'record_manuel', notes: type });
    } else if (currentSport === 'Musculation') {
        const nom = document.getElementById('rec-nom')?.value?.trim();
        const poids_kg = parseFloat(document.getElementById('rec-poids')?.value);
        const reps = parseInt(document.getElementById('rec-reps')?.value);
        if (!nom || isNaN(poids_kg)) return;
        const { data: seance } = await db.from('seances').insert({ user_id: uid, sport: 'Musculation', date, source: 'record_manuel', notes: nom }).select().single();
        if (seance) await db.from('exercices').insert({ seance_id: seance.id, nom, poids_kg, reps, series: 1 });
    } else {
        const nom = document.getElementById('rec-nom')?.value?.trim();
        const reps = parseInt(document.getElementById('rec-reps')?.value);
        if (!nom || isNaN(reps)) return;
        const { data: seance } = await db.from('seances').insert({ user_id: uid, sport: 'Street Workout', date, source: 'record_manuel', notes: nom }).select().single();
        if (seance) await db.from('exercices').insert({ seance_id: seance.id, nom, reps, series: 1 });
    }
    document.getElementById('record-modal').style.display = 'none';
    await loadStats();
}

async function loadHistorique() {
    const container = document.getElementById('historique-list');

    const { data: seances } = await db.from('seances')
        .select('*, exercices(*)')
        .neq('source', 'record_manuel')
        .order('date', { ascending: false })
        .limit(50);

    if (!seances?.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🏁</div>Aucune séance enregistrée.</div>`;
        return;
    }

    const emoji = { 'Course à pied': '🏃', 'Musculation': '🏋️', 'Street Workout': '💪' };

    container.innerHTML = seances.map(s => {
        const dateStr = new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR', {
            weekday: 'short', day: 'numeric', month: 'short'
        });

        const exHTML = (() => {
            if (!s.exercices?.length) return '';
            const grouped = {}, order = [];
            s.exercices.forEach(e => {
                if (!grouped[e.nom]) { grouped[e.nom] = []; order.push(e.nom); }
                grouped[e.nom].push(e);
            });
            return order.map(nom => {
                const sets = grouped[nom];
                let detail = '';
                if (sets.some(e => e.distance_km || e.temps_min)) {
                    detail = sets.map(e => [e.distance_km ? `${e.distance_km}km` : '', e.temps_min ? `${e.temps_min}min` : ''].filter(Boolean).join(' ')).join(' / ');
                } else if (sets.some(e => e.reps)) {
                    const setsStr = sets.map(e => e.poids_kg ? `${e.reps}×${e.poids_kg}kg` : `${e.reps}`).join(' / ');
                    detail = `${sets.length} série${sets.length > 1 ? 's' : ''} — ${setsStr}`;
                }
                return `<div class="exercice-item">
                    <span class="exercice-name">${nom}</span>
                    <span class="exercice-detail">${detail}</span>
                </div>`;
            }).join('');
        })();

        if (s.track) trackCache[s.id] = s.track;

        return `<div class="seance-card" id="seance-${s.id}">
            <div class="seance-header">
                <div class="seance-sport">${emoji[s.sport] || '🏋️'} ${s.sport}</div>
                <div style="display:flex;align-items:center;gap:0.75rem">
                    <div class="seance-date">${dateStr}</div>
                    <button class="delete-btn" onclick="deleteSeance(${s.id})" title="Supprimer">🗑</button>
                </div>
            </div>
            <div class="seance-meta">
                ${s.duree_min ? `<span class="meta-chip">⏱ ${s.duree_min} min</span>` : ''}
                ${s.distance_km ? `<span class="meta-chip">📍 ${s.distance_km} km</span>` : ''}
                ${s.pace ? `<span class="meta-chip">↗ ${s.pace}/km</span>` : ''}
                ${s.hr_avg ? `<span class="meta-chip">❤ ${s.hr_avg}/${s.hr_max} bpm</span>` : ''}
                ${s.calories ? `<span class="meta-chip">🔥 ${s.calories} kcal</span>` : ''}
                ${s.exercices?.length ? `<span class="meta-chip">${s.exercices.length} exercice${s.exercices.length > 1 ? 's' : ''}</span>` : ''}
            </div>
            ${s.splits?.length ? `<div class="splits-wrap">${s.splits.map(sp => `<span class="split-chip"><span class="split-km">${sp.km}km</span>${sp.pace}</span>`).join('')}</div>` : ''}
            ${s.track ? `<button class="btn-map" onclick="showMap(${s.id})">Voir le tracé</button>` : ''}
            ${s.notes ? `<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem">${s.notes}</div>` : ''}
            ${exHTML ? `<div class="exercice-list">${exHTML}</div>` : ''}
        </div>`;
    }).join('');
}

// ─── SUPPRIMER SÉANCE ───
async function deleteSeance(id) {
    if (!confirm('Supprimer cette séance ?')) return;
    await db.from('exercices').delete().eq('seance_id', id);
    await db.from('seances').delete().eq('id', id);
    document.getElementById(`seance-${id}`)?.remove();
}

// ─── ANALYSE IA ───
function saveApiKey() {
    const key = document.getElementById('claude-key').value.trim();
    const msg = document.getElementById('key-msg');
    if (!key.startsWith('sk-ant-')) {
        showMsg(msg, 'error', 'Clé invalide (doit commencer par sk-ant-).');
        return;
    }
    localStorage.setItem('claude_api_key', key);
    showMsg(msg, 'success', 'Clé enregistrée localement.');
}

async function analyser() {
    const key = localStorage.getItem('claude_api_key');
    const output = document.getElementById('analyse-output');
    const loading = document.getElementById('analyse-loading');

    if (!key) {
        output.textContent = 'Renseigne ta clé API Claude dans la section ci-dessus.';
        output.style.display = 'block';
        return;
    }

    const jours = parseInt(document.getElementById('analyse-periode').value);
    const question = document.getElementById('analyse-question').value.trim();
    const dateMin = new Date(Date.now() - jours * 86400000).toISOString().split('T')[0];

    const { data: seances } = await db.from('seances')
        .select('*, exercices(*)')
        .gte('date', dateMin)
        .order('date', { ascending: true });

    if (!seances?.length) {
        output.textContent = 'Aucune séance enregistrée sur cette période.';
        output.style.display = 'block';
        return;
    }

    const prompt = `Tu es un coach sportif expert en musculation, course à pied et street workout. Voici les données d'entraînement de Clément sur les ${jours} derniers jours :

${JSON.stringify(seances, null, 2)}

${question
    ? `Question : ${question}`
    : 'Fais une analyse globale : volume, progression, équilibre entre les sports, points forts, axes d\'amélioration. Donne des conseils concrets et personnalisés, basés uniquement sur ces données.'}`;

    loading.style.display = 'flex';
    output.style.display = 'none';

    try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: 'claude-opus-4-8',
                max_tokens: 1024,
                messages: [{ role: 'user', content: prompt }]
            })
        });

        const json = await res.json();
        output.textContent = json.content?.[0]?.text || 'Erreur dans la réponse de l\'API.';
    } catch {
        output.textContent = 'Erreur de connexion à l\'API Claude.';
    }

    loading.style.display = 'none';
    output.style.display = 'block';
}

// ─── UTILS ───
function showMsg(el, type, text) {
    el.textContent = text;
    el.className = `msg ${type}`;
    el.style.display = 'block';
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') login();
});

checkSession();

// ─── CARTE GPS ───
const trackCache = {};
let mapInstance = null;

function showMap(id) {
    const track = trackCache[id];
    if (!track?.length) return;
    const card = document.getElementById(`seance-${id}`);
    const title = card?.querySelector('.seance-sport')?.textContent + ' · ' + card?.querySelector('.seance-date')?.textContent;
    document.getElementById('map-title').textContent = title || '';
    document.getElementById('map-modal').style.display = 'block';
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
    setTimeout(() => {
        mapInstance = L.map('map', { zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '©OpenStreetMap ©CartoDB', maxZoom: 19
        }).addTo(mapInstance);
        const line = L.polyline(track, { color: '#38bdf8', weight: 3, opacity: 0.9 }).addTo(mapInstance);
        L.circleMarker(track[0], { radius: 6, color: '#38bdf8', fillColor: '#060c15', fillOpacity: 1, weight: 2 }).addTo(mapInstance);
        L.circleMarker(track[track.length-1], { radius: 6, color: '#fb923c', fillColor: '#060c15', fillOpacity: 1, weight: 2 }).addTo(mapInstance);
        mapInstance.fitBounds(line.getBounds(), { padding: [24, 24] });
    }, 50);
}

function closeMap() {
    document.getElementById('map-modal').style.display = 'none';
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
}
