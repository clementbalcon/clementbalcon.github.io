<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Training">
    <title>Training — Clément Balcon</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #060c15;
            --accent: #38bdf8;
            --accent2: #fb923c;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --subtle: #1e293b;
            --card: #0f1c2e;
            --border: rgba(56,189,248,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56,189,248,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,189,248,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── LOGIN ─── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .login-sub {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        /* ─── FORM ELEMENTS ─── */
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, textarea {
            width: 100%;
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        select option { background: var(--card); }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: #060c15;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
        .btn-orange { background: var(--accent2); }

        /* ─── APP ─── */
        #app-screen {
            display: none;
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .app-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
        }

        .logout-btn:hover { color: var(--text); }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.3rem;
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.6rem;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--subtle);
            color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── CARDS ─── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1.25rem;
        }

        /* ─── SPORT PICKER ─── */
        .sport-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .sport-btn {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 0.75rem 0.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .sport-emoji { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }

        .sport-btn:hover, .sport-btn.selected {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56,189,248,0.08);
        }

        /* ─── EXERCICE FORM ─── */
        .exercice-form {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .exercice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .exercice-num {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem 0.4rem;
        }

        .remove-btn:hover { color: #f87171; }

        .exercice-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .exercice-row input { margin-bottom: 0; }

        /* ─── HISTORIQUE ─── */
        .seance-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .seance-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .seance-sport {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .seance-date { font-size: 0.8rem; color: var(--muted); }

        .seance-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .meta-chip {
            background: var(--subtle);
            border-radius: 6px;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            color: var(--muted);
        }

        .exercice-list {
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .exercice-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exercice-name { font-size: 0.85rem; color: var(--text); }
        .exercice-detail { font-size: 0.8rem; color: var(--muted); }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.4;
            padding: 0.1rem 0.3rem;
            transition: opacity 0.2s;
        }

        .delete-btn:hover { opacity: 1; }

        /* ─── EXERCISE PICKER ─── */
        .ex-preview {
            display: none;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg);
            text-align: center;
        }

        .ex-preview img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            display: block;
        }

        .ex-preview-placeholder {
            padding: 1.5rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* ─── ANALYSE ─── */
        .analyse-output {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            line-height: 1.75;
            white-space: pre-wrap;
            display: none;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── MESSAGES ─── */
        .msg {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
        .msg.success { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); color: var(--accent); }
        .msg.info { background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); color: var(--accent2); }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

        /* ─── CHRONO ─── */
        .chrono-wrap {
            background: var(--subtle);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        #chrono-display {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .chrono-btns {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .chrono-btn {
            background: var(--accent);
            border: none;
            border-radius: 7px;
            color: #060c15;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            transition: opacity 0.2s;
        }

        .chrono-btn:hover { opacity: 0.85; }
        .chrono-reset { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    </style>
</head>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
    <div class="login-card">
        <div class="login-title">Training</div>
        <div class="login-sub">Espace privé — Clément Balcon</div>
        <div id="login-msg" class="msg error"></div>
        <label>Email</label>
        <input type="email" id="email" placeholder="ton@email.com" autocomplete="email">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <button class="btn" onclick="login()">Connexion</button>
    </div>
</div>

<!-- ─── APP ─── -->
<div id="app-screen">
    <div class="app-header">
        <div class="app-title">Training</div>
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('nouvelle')">Séance</button>
        <button class="tab" onclick="switchTab('historique')">Historique</button>
        <button class="tab" onclick="switchTab('analyse')">IA</button>
    </div>

    <!-- TAB: NOUVELLE SÉANCE -->
    <div id="tab-nouvelle" class="tab-content active">
        <div class="card">
            <div class="card-title">Nouvelle séance</div>
            <div id="seance-msg" class="msg"></div>

            <label>Sport</label>
            <div class="sport-grid">
                <button class="sport-btn" onclick="selectSport('Course à pied', this)">
                    <span class="sport-emoji">🏃</span>Course
                </button>
                <button class="sport-btn" onclick="selectSport('Musculation', this)">
                    <span class="sport-emoji">🏋️</span>Muscu
                </button>
                <button class="sport-btn" onclick="selectSport('Street Workout', this)">
                    <span class="sport-emoji">💪</span>Street
                </button>
            </div>

            <label>Date</label>
            <input type="date" id="seance-date">

            <label>Durée</label>
            <div class="chrono-wrap">
                <div id="chrono-display">00:00:00</div>
                <div class="chrono-btns">
                    <button class="chrono-btn" id="chrono-toggle" onclick="chronoToggle()">Démarrer</button>
                    <button class="chrono-btn chrono-reset" onclick="chronoReset()">Réinitialiser</button>
                </div>
            </div>

            <label>Notes</label>
            <textarea id="seance-notes" placeholder="Ressenti, conditions, objectifs..."></textarea>
        </div>

        <div class="card">
            <div class="card-title">Exercices</div>
            <div id="exercices-container"></div>
            <button class="btn btn-secondary" onclick="addExercice()" style="margin-bottom:0">+ Ajouter un exercice</button>
        </div>

        <div style="margin-top:1rem">
            <button class="btn" onclick="saveSeance()">Enregistrer la séance</button>
        </div>
    </div>

    <!-- TAB: HISTORIQUE -->
    <div id="tab-historique" class="tab-content">
        <div style="padding:1rem 1rem 0">
            <input type="file" id="apple-health-input" accept=".xml" style="display:none" onchange="handleAppleHealthImport(event)">
            <button class="btn btn-secondary" onclick="document.getElementById('apple-health-input').click()" style="width:100%;margin-bottom:0.75rem">
                ↑ Importer Apple Health (export.xml)
            </button>
            <div id="import-msg" class="msg"></div>
        </div>
        <div id="historique-list">
            <div class="empty-state">
                <div class="empty-icon">📋</div>
                Chargement...
            </div>
        </div>
    </div>

    <!-- TAB: ANALYSE IA -->
    <div id="tab-analyse" class="tab-content">
        <div class="card">
            <div class="card-title">Clé API Claude</div>
            <label>Clé API Anthropic</label>
            <input type="password" id="claude-key" placeholder="sk-ant-..." autocomplete="off">
            <div id="key-msg" class="msg" style="margin-bottom:0"></div>
            <button class="btn btn-secondary" onclick="saveApiKey()" style="margin-top:0.75rem">Enregistrer la clé</button>
        </div>

        <div class="card">
            <div class="card-title">Analyse de tes entraînements</div>
            <label>Période</label>
            <select id="analyse-periode">
                <option value="7">7 derniers jours</option>
                <option value="14">14 derniers jours</option>
                <option value="30" selected>30 derniers jours</option>
                <option value="90">3 derniers mois</option>
            </select>
            <label>Question ou focus (optionnel)</label>
            <textarea id="analyse-question" placeholder="Ex : Suis-je en progression sur le squat ? Comment améliorer ma récupération ?"></textarea>
            <button class="btn btn-orange" onclick="analyser()">Analyser avec Claude</button>
            <div id="analyse-loading" class="loading">
                <div class="spinner"></div> Claude analyse tes données...
            </div>
            <div id="analyse-output" class="analyse-output"></div>
        </div>
    </div>
</div>

let selectedSport = null;
let exerciceCount = 0;
let chronoSeconds = 0;
let chronoInterval = null;
let chronoRunning = false;

function chronoToggle() {
    const btn = document.getElementById('chrono-toggle');
    if (chronoRunning) {
        clearInterval(chronoInterval);
        chronoRunning = false;
        btn.textContent = 'Reprendre';
    } else {
        chronoInterval = setInterval(() => {
            chronoSeconds++;
            const h = String(Math.floor(chronoSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((chronoSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(chronoSeconds % 60).padStart(2, '0');
            document.getElementById('chrono-display').textContent = `${h}:${m}:${s}`;
        }, 1000);
        chronoRunning = true;
        btn.textContent = 'Pause';
    }
}

function chronoReset() {
    clearInterval(chronoInterval);
    chronoRunning = false;
    chronoSeconds = 0;
    document.getElementById('chrono-display').textContent = '00:00:00';
    document.getElementById('chrono-toggle').textContent = 'Démarrer';
}

// ─── AUTH ───
async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('login-msg');

    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
        showMsg(msg, 'error', 'Email ou mot de passe incorrect.');
    } else {
        showApp();
    }
}

async function logout() {
    await db.auth.signOut();
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
    const { data: { session } } = await db.auth.getSession();
    if (session) showApp();
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('seance-date').value = new Date().toISOString().split('T')[0];
    const key = localStorage.getItem('claude_api_key');
    if (key) document.getElementById('claude-key').value = key;
    loadHistorique();
}

// ─── TABS ───
function switchTab(name) {
    const names = ['nouvelle', 'historique', 'analyse'];
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', names[i] === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'historique') loadHistorique();
}

// ─── SPORT ───
function selectSport(sport, el) {
    selectedSport = sport;
    document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

// ─── EXERCICES ───
function getFieldsHTML(sport) {
    if (sport === 'Course à pied') {
        return `<div class="exercice-row">
            <div><label>Distance (km)</label><input type="number" class="ex-distance" placeholder="10" min="0" step="0.1"></div>
            <div><label>Temps (min)</label><input type="number" class="ex-temps" placeholder="50" min="0"></div>
        </div>`;
    }
    let html = `<div class="exercice-row">
        <div><label>Séries</label><input type="number" class="ex-series" placeholder="4" min="1"></div>
        <div><label>Reps</label><input type="number" class="ex-reps" placeholder="10" min="1"></div>
    </div>`;
    if (sport === 'Musculation') {
        html += `<div><label>Poids (kg)</label><input type="number" class="ex-poids" placeholder="80" min="0" step="0.5"></div>`;
    }
    return html;
}

function addExercice() {
    exerciceCount++;
    const sport = selectedSport || 'Musculation';
    const sportDB = EXERCISE_DB[sport] || {};
    const categories = Object.keys(sportDB);
    const firstCat = categories[0];
    const firstExercises = sportDB[firstCat] || [];
    const firstEx = firstExercises[0];
    const firstImg = firstEx?.gif || null;

    const catOptions = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    const exOptions = firstExercises.map(e =>
        `<option value="${e.nom}" data-img="${e.gif || ''}">${e.nom}</option>`
    ).join('');

    const div = document.createElement('div');
    div.className = 'exercice-form';
    div.innerHTML = `
        <div class="exercice-header">
            <span class="exercice-num">Exercice ${exerciceCount}</span>
            <button class="remove-btn" onclick="this.closest('.exercice-form').remove()">✕</button>
        </div>
        ${categories.length > 1 ? `<label>Catégorie</label><select class="ex-category" onchange="updateExerciceList(this)">${catOptions}</select>` : ''}
        <label>Exercice</label>
        <select class="ex-nom-select" onchange="updateExercicePreview(this)">${exOptions}</select>
        <div class="ex-preview" style="${firstImg ? 'display:block' : 'display:none'}">
            ${firstImg ? `<img src="${firstImg}" onerror="this.closest('.ex-preview').style.display='none'">` : ''}
        </div>
        ${getFieldsHTML(sport)}
        <label>Notes</label>
        <input type="text" class="ex-notes" placeholder="Optionnel" style="margin-bottom:0">
    `;
    document.getElementById('exercices-container').appendChild(div);
}

function updateExerciceList(categorySelect) {
    const form = categorySelect.closest('.exercice-form');
    const sport = selectedSport || 'Musculation';
    const exs = EXERCISE_DB[sport]?.[categorySelect.value] || [];
    const exSelect = form.querySelector('.ex-nom-select');
    exSelect.innerHTML = exs.map(e =>
        `<option value="${e.nom}" data-img="${e.gif || ''}">${e.nom}</option>`
    ).join('');
    updateExercicePreview(exSelect);
}

function updateExercicePreview(exSelect) {
    const form = exSelect.closest('.exercice-form');
    const preview = form.querySelector('.ex-preview');
    const imgUrl = exSelect.options[exSelect.selectedIndex]?.dataset.img;
    if (imgUrl) {
        preview.innerHTML = `<img src="${imgUrl}" onerror="this.closest('.ex-preview').style.display='none'">`;
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
}

// ─── SAVE SÉANCE ───
async function saveSeance() {
    const msg = document.getElementById('seance-msg');

    if (!selectedSport) {
        showMsg(msg, 'error', 'Sélectionne un sport.');
        return;
    }

    const date = document.getElementById('seance-date').value;
    const duree = chronoSeconds > 0 ? Math.round(chronoSeconds / 60) : null;
    const notes = document.getElementById('seance-notes').value;

    const { data: { user } } = await db.auth.getUser();

    const { data: seance, error } = await db.from('seances').insert({
        sport: selectedSport, date, duree_min: duree, notes, user_id: user.id
    }).select().single();

    if (error) { showMsg(msg, 'error', 'Erreur lors de l\'enregistrement.'); return; }

    const exercices = [];
    document.querySelectorAll('.exercice-form').forEach(form => {
        const nom = form.querySelector('.ex-nom-select')?.value?.trim() || form.querySelector('.ex-nom')?.value?.trim();
        if (!nom) return;
        exercices.push({
            seance_id: seance.id,
            nom,
            series:      parseInt(form.querySelector('.ex-series')?.value)    || null,
            reps:        parseInt(form.querySelector('.ex-reps')?.value)       || null,
            poids_kg:    parseFloat(form.querySelector('.ex-poids')?.value)    || null,
            distance_km: parseFloat(form.querySelector('.ex-distance')?.value) || null,
            temps_min:   parseFloat(form.querySelector('.ex-temps')?.value)    || null,
            notes:       form.querySelector('.ex-notes')?.value                || null,
        });
    });

    if (exercices.length > 0) await db.from('exercices').insert(exercices);

    showMsg(msg, 'success', 'Séance enregistrée !');
    setTimeout(() => {
        document.getElementById('seance-notes').value = '';
        chronoReset();
        document.getElementById('exercices-container').innerHTML = '';
        document.getElementById('seance-date').value = new Date().toISOString().split('T')[0];
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('selected'));
        selectedSport = null;
        exerciceCount = 0;
        msg.style.display = 'none';
    }, 2000);
}

// ─── IMPORT APPLE HEALTH ───
async function handleAppleHealthImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const importMsg = document.getElementById('import-msg');
    showMsg(importMsg, 'info', 'Lecture du fichier en cours...');

    const text = await file.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');

    const workouts = Array.from(xml.querySelectorAll('Workout[workoutActivityType="HKWorkoutActivityTypeRunning"]'));
    if (!workouts.length) {
        showMsg(importMsg, 'error', 'Aucune course à pied trouvée dans ce fichier.');
        return;
    }

    showMsg(importMsg, 'info', `${workouts.length} courses trouvées, import en cours...`);

    const userId = (await db.auth.getUser()).data.user.id;

    const { data: existing } = await db.from('seances')
        .select('external_id')
        .eq('user_id', userId)
        .not('external_id', 'is', null);
    const existingIds = new Set(existing?.map(r => r.external_id) || []);

    const toInsert = [];
    for (const w of workouts) {
        const startDate = w.getAttribute('startDate');
        if (existingIds.has(startDate)) continue;

        const duration = parseFloat(w.getAttribute('duration'));
        const date = startDate.substring(0, 10);

        let distanceKm = null, calories = null;
        for (const s of w.querySelectorAll('WorkoutStatistics')) {
            const type = s.getAttribute('type');
            if (type === 'HKQuantityTypeIdentifierDistanceWalkingRunning')
                distanceKm = Math.round(parseFloat(s.getAttribute('sum')) * 100) / 100;
            if (type === 'HKQuantityTypeIdentifierActiveEnergyBurned')
                calories = Math.round(parseFloat(s.getAttribute('sum')));
        }

        toInsert.push({
            user_id: userId,
            sport: 'Course à pied',
            date,
            duree_min: Math.round(duration),
            distance_km: distanceKm,
            calories,
            source: 'apple_health',
            external_id: startDate
        });
    }

    if (!toInsert.length) {
        showMsg(importMsg, 'success', 'Toutes les courses sont déjà importées.');
        return;
    }

    let inserted = 0;
    for (let i = 0; i < toInsert.length; i += 50) {
        const { error } = await db.from('seances').insert(toInsert.slice(i, i + 50));
        if (!error) inserted += Math.min(50, toInsert.length - i);
    }

    const skipped = workouts.length - toInsert.length;
    showMsg(importMsg, 'success', `✓ ${inserted} courses importées${skipped ? `, ${skipped} déjà présentes` : ''}.`);
    loadHistorique();
}

async function loadHistorique() {
    const container = document.getElementById('historique-list');

    const { data: seances } = await db.from('seances')
        .select('*, exercices(*)')
        .order('date', { ascending: false })
        .limit(50);

    if (!seances?.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🏁</div>Aucune séance enregistrée.</div>`;
        return;
    }

    const emoji = { 'Course à pied': '🏃', 'Musculation': '🏋️', 'Street Workout': '💪' };

    container.innerHTML = seances.map(s => {
        const dateStr = new Date(s.date + 'T00:00:00').toLocaleDateString('fr-FR', {
            weekday: 'short', day: 'numeric', month: 'short'
        });

        const exHTML = s.exercices?.length ? s.exercices.map(e => {
            let detail = '';
            if (e.series && e.reps) detail += `${e.series}×${e.reps}`;
            if (e.poids_kg)   detail += ` · ${e.poids_kg}kg`;
            if (e.distance_km) detail += `${e.distance_km}km`;
            if (e.temps_min)  detail += ` · ${e.temps_min}min`;
            return `<div class="exercice-item">
                <span class="exercice-name">${e.nom}</span>
                <span class="exercice-detail">${detail}</span>
            </div>`;
        }).join('') : '';

        return `<div class="seance-card" id="seance-${s.id}">
            <div class="seance-header">
                <div class="seance-sport">${emoji[s.sport] || '🏋️'} ${s.sport}</div>
                <div style="display:flex;align-items:center;gap:0.75rem">
                    <div class="seance-date">${dateStr}</div>
                    <button class="delete-btn" onclick="deleteSeance(${s.id})" title="Supprimer">🗑</button>
                </div>
            </div>
            <div class="seance-meta">
                ${s.duree_min ? `<span class="meta-chip">⏱ ${s.duree_min} min</span>` : ''}
                ${s.distance_km ? `<span class="meta-chip">📍 ${s.distance_km} km</span>` : ''}
                ${s.calories ? `<span class="meta-chip">🔥 ${s.calories} kcal</span>` : ''}
                ${s.exercices?.length ? `<span class="meta-chip">${s.exercices.length} exercice${s.exercices.length > 1 ? 's' : ''}</span>` : ''}
            </div>
            ${s.notes ? `<div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem">${s.notes}</div>` : ''}
            ${exHTML ? `<div class="exercice-list">${exHTML}</div>` : ''}
        </div>`;
    }).join('');
}

// ─── SUPPRIMER SÉANCE ───
async function deleteSeance(id) {
    if (!confirm('Supprimer cette séance ?')) return;
    await db.from('exercices').delete().eq('seance_id', id);
    await db.from('seances').delete().eq('id', id);
    document.getElementById(`seance-${id}`)?.remove();
}

// ─── ANALYSE IA ───
function saveApiKey() {
    const key = document.getElementById('claude-key').value.trim();
    const msg = document.getElementById('key-msg');
    if (!key.startsWith('sk-ant-')) {
        showMsg(msg, 'error', 'Clé invalide (doit commencer par sk-ant-).');
        return;
    }
    localStorage.setItem('claude_api_key', key);
    showMsg(msg, 'success', 'Clé enregistrée localement.');
}

async function analyser() {
    const key = localStorage.getItem('claude_api_key');
    const output = document.getElementById('analyse-output');
    const loading = document.getElementById('analyse-loading');

    if (!key) {
        output.textContent = 'Renseigne ta clé API Claude dans la section ci-dessus.';
        output.style.display = 'block';
        return;
    }

    const jours = parseInt(document.getElementById('analyse-periode').value);
    const question = document.getElementById('analyse-question').value.trim();
    const dateMin = new Date(Date.now() - jours * 86400000).toISOString().split('T')[0];

    const { data: seances } = await db.from('seances')
        .select('*, exercices(*)')
        .gte('date', dateMin)
        .order('date', { ascending: true });

    if (!seances?.length) {
        output.textContent = 'Aucune séance enregistrée sur cette période.';
        output.style.display = 'block';
        return;
    }

    const prompt = `Tu es un coach sportif expert en musculation, course à pied et street workout. Voici les données d'entraînement de Clément sur les ${jours} derniers jours :

${JSON.stringify(seances, null, 2)}

${question
    ? `Question : ${question}`
    : 'Fais une analyse globale : volume, progression, équilibre entre les sports, points forts, axes d\'amélioration. Donne des conseils concrets et personnalisés, basés uniquement sur ces données.'}`;

    loading.style.display = 'flex';
    output.style.display = 'none';

    try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: 'claude-opus-4-8',
                max_tokens: 1024,
                messages: [{ role: 'user', content: prompt }]
            })
        });

        const json = await res.json();
        output.textContent = json.content?.[0]?.text || 'Erreur dans la réponse de l\'API.';
    } catch {
        output.textContent = 'Erreur de connexion à l\'API Claude.';
    }

    loading.style.display = 'none';
    output.style.display = 'block';
}

// ─── UTILS ───
function showMsg(el, type, text) {
    el.textContent = text;
    el.className = `msg ${type}`;
    el.style.display = 'block';
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') login();
});

checkSession();
